<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger Smart — Personal Finance & Budget Tracker</title>
    <meta name="description" content="Track your income, expenses, and savings goals with AI-powered insights. Free personal finance manager for Kenyans." />
    
    <!-- Open Graph (WhatsApp, LinkedIn previews) -->
    <meta property="og:title" content="Ledger Smart — Personal Finance Tracker" />
    <meta property="og:description" content="AI-powered budget tracking with Gemini insights." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-app.vercel.app" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ledger Smart" />
    <meta name="twitter:description" content="Smart personal finance tracker with Gemini AI." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <script>
      (function() {
        // Prevent stale/invalid refresh token warnings or errors from bubbling up to any environment trackers
        const isRefreshTokenError = function(msg) {
          if (!msg) return false;
          const searchStr = String(msg).toLowerCase();
          return searchStr.includes('refresh token') || 
                 searchStr.includes('refresh_token') || 
                 searchStr.includes('invalid_grant') ||
                 searchStr.includes('invalid refresh token') ||
                 searchStr.includes('token not found') ||
                 searchStr.includes('not found') ||
                 searchStr.includes('auth-token');
        };

        const originalConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(arg => {
            if (arg && typeof arg === 'object') {
              return arg.message || arg.error || JSON.stringify(arg);
            }
            return String(arg);
          }).join(' ');

          if (isRefreshTokenError(msg)) {
            console.warn("[Filtered App Error] Suppressed stale Supabase session refresh error:", ...args);
            return;
          }
          originalConsoleError.apply(console, args);
        };

        const originalConsoleWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(arg => {
            if (arg && typeof arg === 'object') {
              return arg.message || arg.error || JSON.stringify(arg);
            }
            return String(arg);
          }).join(' ');

          if (isRefreshTokenError(msg)) {
            // Silently suppress refresh token warnings
            return;
          }
          originalConsoleWarn.apply(console, args);
        };

        // Suppressed via raw onerror prior to event bubbling / test listener interception
        const originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          const msg = message || (error && error.message) || "";
          if (isRefreshTokenError(msg)) {
            console.warn("[Filtered App OnError] Suppressed refresh token error:", msg);
            return true; // prevent default firing & tell browser it is handled
          }
          if (originalOnError) {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };

        // Listen in capturing phase to intercept the events before test suite listeners
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = reason && (reason.message || reason.error || String(reason) || (reason.error && reason.error.message));
          if (isRefreshTokenError(msg)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            console.warn("[Filtered App Rejection] Prevented unhandled rejection for stale refresh token:", msg);
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || (event.error && event.error.message);
          if (isRefreshTokenError(msg)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            console.warn("[Filtered App Error Event] Prevented stale refresh token error event:", msg);
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
